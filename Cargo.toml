[package]
name = "nosql_orm"
version = "0.9.0"
edition = "2021"
authors = ["Dmitriy303"]
description = "A TypeORM-inspired async ORM with one Storage API over JSON files, MongoDB, Redis and SQL (Postgres, MySQL, SQLite)"
license = "MIT"
repository = "https://github.com/rusnakdima/nosql_orm"
keywords = ["orm", "mongodb", "json", "nosql", "database"]
categories = ["database", "data-structures"]

[lib]
name = "nosql_orm"
path = "src/lib.rs"

[features]
default = ["json"]
json = []
mongo = ["dep:mongodb"]
redis = ["dep:redis"]
full = ["json", "mongo", "redis", "sql"]
sql = ["sql-postgres", "sql-sqlite", "sql-mysql"]
sql-postgres = ["dep:tokio-postgres", "dep:deadpool-postgres"]
sql-sqlite = ["dep:rusqlite"]
sql-mysql = ["dep:mysql_async"]
query_cache = []

# New SQL providers (stubs — full implementation coming)
sql-mssql = []
sql-oracle = []
sql-cockroach = []
sql-duckdb = []
sql-clickhouse = []
sql-mariadb = []

# New NoSQL providers (stubs — full implementation coming)
couchdb = []
couchbase = []
dynamodb = []
firestore = []
elasticsearch = []
neo4j = []
influxdb = []
cassandra = []
etcd = []

# GraphQL provider (stub)
graphql = []

# Vector database providers (stubs)
pinecone = []
weaviate = []
milvus = []
qdrant = []
chroma = []
pgvector = ["sql-postgres"]
redis-vector = []

# Extension modules that no code path in Storage, Repository or the providers
# reaches yet. They are opt-in so the default build carries only the storage
# surface the crate actually integrates; each is documented in docs/07-features.
embedded = []
inheritance = []
lazy = []

[dependencies]
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
futures = "0.3"
mongodb = { version = "2", optional = true }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"], optional = true }
regex = "1"
deadpool = "0.10"
rand = "0.8"
deadpool-postgres = { version = "0.12", optional = true }
mysql_async = { version = "0.33", optional = true }
tokio-postgres = { version = "0.7", optional = true }
rusqlite = { version = "0.33", optional = true, features = ["bundled"] }
base64 = { version = "0.22" }
ring = "0.17"
nosql_orm_derive = { path = "nosql_orm_derive" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
proptest = "1"
tracing-test = "0.2"
parking_lot = "0.12"

[[test]]
name = "test_sqlite_integration"
path = "tests/test_sqlite_integration.rs"
required-features = ["sql-sqlite"]

[[test]]
name = "test_postgres_integration"
path = "tests/test_postgres_integration.rs"
required-features = ["sql-postgres"]

[[test]]
name = "test_mysql_integration"
path = "tests/test_mysql_integration.rs"
required-features = ["sql-mysql"]

[[test]]
name = "test_redis_provider"
path = "tests/test_redis_provider.rs"
required-features = ["redis"]

[[test]]
name = "test_sql_projection"
path = "tests/test_sql_projection.rs"
required-features = ["sql-sqlite"]

[[example]]
name = "json_example"
path = "examples/json_example.rs"

[[example]]
name = "mongo_example"
path = "examples/mongo_example.rs"
required-features = ["mongo"]

[[example]]
name = "sql_example"
path = "examples/sql_example.rs"
required-features = ["sql-sqlite"]

[[example]]
name = "sql_postgres_example"
path = "examples/sql_postgres_example.rs"
required-features = ["sql-postgres"]

[[example]]
name = "sql_mysql_example"
path = "examples/sql_mysql_example.rs"
required-features = ["sql-mysql"]
