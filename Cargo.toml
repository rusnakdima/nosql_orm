[package]
name = "nosql_orm"
version = "0.10.0"
edition = "2021"
authors = ["Dmitriy303"]
description = "A TypeORM-inspired async ORM with one Storage API over JSON files, MongoDB, Redis and SQL (Postgres, MySQL, SQLite)"
license = "MIT"
repository = "https://github.com/rusnakdima/nosql_orm"
keywords = ["orm", "mongodb", "json", "nosql", "database"]
categories = ["database", "data-structures"]

[lib]
name = "nosql_orm"
path = "src/lib.rs"

[features]
default = ["json"]
json = []
mongo = ["dep:mongodb"]
redis = ["dep:redis"]
full = [
  "json",
  "mongo",
  "redis",
  "sql",
  "sql-mssql",
  "sql-oracle",
  "sql-cockroach",
  "sql-duckdb",
  "sql-clickhouse",
  "sql-mariadb",
  "couchdb",
  "couchbase",
  "dynamodb",
  "firestore",
  "elasticsearch",
  "neo4j",
  "influxdb",
  "cassandra",
  "etcd",
  "graphql",
  "pinecone",
  "weaviate",
  "milvus",
  "qdrant",
  "chroma",
  "pgvector",
  "redis-vector",
]
sql = ["sql-postgres", "sql-sqlite", "sql-mysql"]
sql-postgres = ["dep:tokio-postgres", "dep:deadpool-postgres"]
sql-sqlite = ["dep:rusqlite"]
sql-mysql = ["dep:mysql_async"]
query_cache = []

# New SQL providers.
# sql-mssql / sql-duckdb / sql-clickhouse / sql-oracle run on their own native
# drivers. Oracle's driver vendors ODPI-C, so it compiles anywhere; only
# `connect` needs the Oracle Client library at runtime (ODPI-C loads it).
sql-mssql = ["dep:tiberius", "dep:tokio-util"]
sql-oracle = ["dep:oracle"]
sql-cockroach = ["sql-postgres"]
sql-duckdb = ["dep:duckdb"]
sql-clickhouse = ["dep:clickhouse"]
sql-mariadb = ["sql-mysql"]

# New NoSQL providers.
# etcd and InfluxDB run on their own native drivers; the rest still reuse an
# existing provider as a baseline (native drivers pending).
etcd = ["dep:etcd-client"]
couchdb = ["dep:reqwest"]
couchbase = ["mongo"]
dynamodb = ["dep:reqwest"]
firestore = ["mongo"]
elasticsearch = ["dep:reqwest"]
neo4j = ["mongo"]
influxdb = ["dep:influxdb"]
cassandra = ["mongo"]

# GraphQL provider
graphql = ["json"]

# Vector database providers
pinecone = ["mongo"]
weaviate = ["mongo"]
milvus = ["mongo"]
qdrant = ["mongo"]
chroma = ["mongo"]
pgvector = ["sql-postgres"]
redis-vector = ["redis"]

# Opt-in extension modules wired into Repository behind their flag:
# embedded flattens/expands documents and rewrites nested filter paths,
# inheritance scopes queries by discriminator and reads parent tables,
# lazy builds load-on-access relation handles. Kept off by default so the
# default build carries only the storage surface the crate actually uses
# out of the box; each is documented in docs/07-features.
embedded = []
inheritance = []
lazy = []

[dependencies]
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
futures = "0.3"
mongodb = { version = "2", optional = true }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"], optional = true }
regex = "1"
deadpool = "0.10"
rand = "0.8"
deadpool-postgres = { version = "0.12", optional = true }
mysql_async = { version = "0.33", optional = true }
tokio-postgres = { version = "0.7", optional = true }
rusqlite = { version = "0.33", optional = true, features = ["bundled"] }
duckdb = { version = "1.20000", optional = true }
clickhouse = { version = "0.15", optional = true }
tiberius = { version = "0.13", optional = true, default-features = false, features = ["tds80", "native-tls"] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }
oracle = { version = "0.6", optional = true }
etcd-client = { version = "0.21", optional = true }
influxdb = { version = "0.8", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
base64 = { version = "0.22" }
ring = "0.17"
nosql_orm_derive = { path = "nosql_orm_derive" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
proptest = "1"
tracing-test = "0.2"
parking_lot = "0.12"

[[test]]
name = "test_sqlite_integration"
path = "tests/test_sqlite_integration.rs"
required-features = ["sql-sqlite"]

[[test]]
name = "test_savepoints"
path = "tests/test_savepoints.rs"
required-features = ["sql-sqlite"]

[[test]]
name = "test_postgres_integration"
path = "tests/test_postgres_integration.rs"
required-features = ["sql-postgres"]

[[test]]
name = "test_mysql_integration"
path = "tests/test_mysql_integration.rs"
required-features = ["sql-mysql"]

[[test]]
name = "test_duckdb_integration"
path = "tests/test_duckdb_integration.rs"
required-features = ["sql-duckdb"]

[[test]]
name = "test_clickhouse_integration"
path = "tests/test_clickhouse_integration.rs"
required-features = ["sql-clickhouse"]

[[test]]
name = "test_mssql_integration"
path = "tests/test_mssql_integration.rs"
required-features = ["sql-mssql"]

[[test]]
name = "test_oracle_integration"
path = "tests/test_oracle_integration.rs"
required-features = ["sql-oracle"]

[[test]]
name = "test_influxdb_integration"
path = "tests/test_influxdb_integration.rs"
required-features = ["influxdb"]

[[test]]
name = "test_etcd_integration"
path = "tests/test_etcd_integration.rs"
required-features = ["etcd"]

[[test]]
name = "test_redis_vector_integration"
path = "tests/test_redis_vector_integration.rs"
required-features = ["redis-vector"]

[[test]]
name = "test_redis_provider"
path = "tests/test_redis_provider.rs"
required-features = ["redis"]

[[test]]
name = "test_sql_projection"
path = "tests/test_sql_projection.rs"
required-features = ["sql-sqlite"]

[[example]]
name = "json_example"
path = "examples/json_example.rs"

[[example]]
name = "mongo_example"
path = "examples/mongo_example.rs"
required-features = ["mongo"]

[[example]]
name = "sql_example"
path = "examples/sql_example.rs"
required-features = ["sql-sqlite"]

[[example]]
name = "sql_postgres_example"
path = "examples/sql_postgres_example.rs"
required-features = ["sql-postgres"]

[[example]]
name = "sql_mysql_example"
path = "examples/sql_mysql_example.rs"
required-features = ["sql-mysql"]


[[test]]
name = "test_couchdb_integration"
path = "tests/test_couchdb_integration.rs"
required-features = ["couchdb"]

[[test]]
name = "test_dynamodb_integration"
path = "tests/test_dynamodb_integration.rs"
required-features = ["dynamodb"]

[[test]]
name = "test_elasticsearch_integration"
path = "tests/test_elasticsearch_integration.rs"
required-features = ["elasticsearch"]
